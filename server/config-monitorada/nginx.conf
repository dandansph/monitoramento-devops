# Configuração monitorada do Web Server (exemplo)
worker_processes auto;
events { worker_connections 1024; }
http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=porip:10m rate=20r/s;
    server {
        listen 443 ssl http2;
        server_name loja-demo.local;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / { limit_req zone=porip burst=40; proxy_pass http://127.0.0.1:4100; }
    }
}
